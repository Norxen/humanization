<div class="login-backdrop" (click)="closed.emit()">
  <section
    class="login-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-title"
    (click)="$event.stopPropagation()"
  >
    <button class="close-login" type="button" aria-label="Close login" (click)="closed.emit()">
      &times;
    </button>
    <span class="login-eyebrow">Editor access</span>
    <h2 id="login-title">Sign in to Manuscript</h2>
    <p>Reading is public. Creating, editing, and deleting documents requires an authorized Firebase account.</p>

    <button class="google-login" type="button" [disabled]="submitting()" (click)="submitGoogle()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.3c1.9-1.8 2.9-4.4 2.9-7.4Z"/>
        <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.5c-.9.6-2.1 1-3.4 1a5.9 5.9 0 0 1-5.5-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/>
        <path fill="#FBBC05" d="M6.5 14a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9.1L6.5 14Z"/>
        <path fill="#EA4335" d="M12 6a5.4 5.4 0 0 1 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 3.1 7.5l3.4 2.7A5.9 5.9 0 0 1 12 6Z"/>
      </svg>
      Continue with Google
    </button>

    <div class="login-divider"><span>or use email</span></div>

    <form (submit)="submit($event)">
      <label>
        Email
        <input
          type="email"
          autocomplete="username"
          required
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        >
      </label>
      <label>
        Password
        <input
          type="password"
          autocomplete="current-password"
          required
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        >
      </label>

      @if (error(); as message) {
        <p class="login-error" role="alert">{{ message }}</p>
      }

      <button class="submit-login" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </section>
</div>
