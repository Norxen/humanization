<div class="login-backdrop" (click)="closed.emit()">
  <section
    class="login-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="password-title"
    (click)="$event.stopPropagation()"
  >
    <button class="close-login" type="button" aria-label="Close password change" (click)="closed.emit()">
      &times;
    </button>
    <span class="login-eyebrow">Account security</span>
    <h2 id="password-title">Change password</h2>
    <p>Confirm your current password before setting a new one.</p>

    <form (submit)="submit($event)">
      <label>
        Current password
        <input
          type="password"
          autocomplete="current-password"
          required
          [value]="currentPassword()"
          (input)="currentPassword.set($any($event.target).value)"
        >
      </label>
      <label>
        New password
        <input
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          [value]="newPassword()"
          (input)="newPassword.set($any($event.target).value)"
        >
      </label>
      <label>
        Confirm new password
        <input
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          [value]="confirmation()"
          (input)="confirmation.set($any($event.target).value)"
        >
      </label>

      @if (error(); as message) {
        <p class="login-error" role="alert">{{ message }}</p>
      }

      <button class="submit-login" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Updating...' : 'Update password' }}
      </button>
    </form>
  </section>
</div>
