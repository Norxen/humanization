<app-modal
  size="small"
  [title]="setMode() ? 'Set password' : 'Change password'"
  eyebrow="Account security"
  [dirty]="!!currentPassword() || !!newPassword() || !!confirmation()"
  [pending]="submitting()"
  (closed)="closed.emit()"
>
    <p>
      {{ setMode()
        ? 'Add an email/password credential to this Google account.'
        : 'Confirm your current password before setting a new one.' }}
    </p>

    <form (submit)="submit($event)">
      @if (!setMode()) {
        <label>
          Current password
          <input
            type="password"
            autocomplete="current-password"
            required
            [value]="currentPassword()"
            (input)="currentPassword.set($any($event.target).value)"
          >
        </label>
      }
      <label>
        New password
        <input
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          [value]="newPassword()"
          (input)="newPassword.set($any($event.target).value)"
        >
      </label>
      <label>
        Confirm new password
        <input
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          [value]="confirmation()"
          (input)="confirmation.set($any($event.target).value)"
        >
      </label>

      @if (error(); as message) {
        <p class="login-error" role="alert">{{ message }}</p>
      }

      <button class="submit-login" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Updating...' : (setMode() ? 'Set password' : 'Update password') }}
      </button>
    </form>
</app-modal>
