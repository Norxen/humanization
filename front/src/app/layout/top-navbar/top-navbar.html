<header class="topbar">
  <div class="brand">
    <button class="menu-button" type="button" (click)="menuToggle.emit()" aria-label="Toggle file tree">
      <span></span><span></span><span></span>
    </button>
    <span class="brand-mark">M</span>
    <span class="brand-name">Manuscript</span>
    <span class="version">design knowledge base</span>
  </div>

  <div class="workspace-info">
    <span class="status-dot"></span>
    <span>Roguelike Civilization Rebuilder</span>
  </div>

  <div class="meta">
    <span>Markdown workspace</span>
    <kbd>Local</kbd>
    <button
      class="theme-button"
      type="button"
      (click)="themeToggle.emit()"
      [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="theme() === 'dark' ? 'Light mode' : 'Dark mode'"
    >
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
        </svg>
      }
    </button>
  </div>
</header>
